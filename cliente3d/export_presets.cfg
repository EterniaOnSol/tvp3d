; Preset de exportacion del cliente descargable de TVP3D.
;
; REGLAS QUE ESTE ARCHIVO RESPETA, y por que:
;
; * `export_path` es RELATIVO al proyecto. El contrato de integracion
;   (seccion 12, "Reglas de path") rechaza cualquier ruta absoluta de maquina
;   en un artefacto versionado: `INTEGRATION_ABSOLUTE_PATH_REJECTED`.
; * No hay credenciales, ni claves, ni firma de codigo, ni IP de ningun
;   servidor. El contrato de integracion (seccion 3) prohibe secretos en
;   configuracion versionada, y el host del cliente NO se hornea aca: se
;   resuelve en tiempo de ejecucion (ver worklog/integracion/EXPORTAR.md).
; * `exclude_filter` deja fuera los arneses de QA de `pruebas/`, que no le
;   sirven a un jugador. Ningun archivo de produccion los referencia.
; * `embed_pck=true` produce UN SOLO archivo, para que bajar el cliente sea
;   bajar un ejecutable y nada mas.
;
; La exportacion se corre por linea de comandos, sin abrir el editor. El
; comando exacto esta en worklog/integracion/EXPORTAR.md.

[preset.0]

; El nombre del preset NO lleva espacios a proposito. Es el argumento que se
; pasa por linea de comandos, y un espacio obliga a citarlo distinto en cada
; shell; con PowerShell el argumento se parte en dos y Godot falla con
; "Invalid export preset name". `platform` si conserva su valor oficial.
name="windows-desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"

; `all_resources` NO alcanza, y esto no es una precaucion teorica: la primera
; exportacion salio con codigo 0 y sin un solo error, y el ejecutable estaba
; ROTO POR DENTRO. Godot empaqueta lo que reconoce como recurso (`.png`,
; `.json`, `.obj`, escenas, scripts) y descarta en silencio cualquier otra
; extension, incluso si el juego la abre con `FileAccess` en tiempo de
; ejecucion. Lo que faltaba:
;
;   assets/mapa772/mapa.bin              45,7 MB, el mapa entero.
;                                        `red/mapa_disco.gd:58` lo abre por
;                                        ruta; sin el, el log del cliente dice
;                                        "Falta res://assets/mapa772/mapa.bin".
;   propio/monstruos3d/mallas/*.tvol     42 mallas 3D de monstruos.
;                                        `propio/monstruos3d/catalogo.gd:55`
;                                        arma la ruta desde `catalogo.json` en
;                                        runtime, asi que Godot no puede verla
;                                        analizando el proyecto. El catalogo si
;                                        se empaquetaba: quedaba prometiendo 42
;                                        monstruos sin una sola malla.
;
; Los dos se cargan por ruta construida en runtime. Esa es la regla general:
; todo lo que no sea un recurso reconocido y se abra con `FileAccess` tiene que
; nombrarse aca o no viaja.
include_filter="assets/mapa772/*.bin,propio/monstruos3d/mallas/*.tvol"

; Fuera del paquete del jugador: arneses de QA (ningun archivo de produccion
; los referencia), herramientas de Python y fuentes de arte de Blender.
exclude_filter="pruebas/*,*.py,*.pyc,*.blend,*.blend1"
export_path="../dist/TVP3D.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

